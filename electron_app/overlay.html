<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaymentSound Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column-reverse;
      gap: 12px;
      align-items: flex-end;
      pointer-events: none;
    }

    .card {
      width: 320px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid #4FC3F7;
      border-left: 4px solid #4CAF50;
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      transform: translateX(360px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  opacity 0.3s ease;
    }

    .card.show {
      transform: translateX(0);
      opacity: 1;
    }

    .card.dismiss {
      transform: translateX(360px);
      opacity: 0;
      transition: transform 0.25s ease-in, opacity 0.25s ease-in;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4CAF50;
      margin-bottom: 8px;
    }

    .amount {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 8px;
    }

    .amount .rupee {
      color: #4FC3F7;
    }

    .no-amount {
      font-size: 16px;
      color: #888;
      margin-bottom: 8px;
    }

    .raw-message {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 12px;
    }

    .progress-bar-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4CAF50, #4FC3F7);
      border-radius: 2px;
      transform-origin: left;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const DURATION = 8000;
    const MAX_STACK = 5;

    const container = document.getElementById('container');

    const cards = [];

    function showNotification(data) {
      if (cards.length >= MAX_STACK) {
        dismissCard(cards[cards.length - 1]);
      }

      const card = document.createElement('div');
      card.className = 'card';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = '✅ UPI Payment';

      let amountEl;
      if (data.amount != null) {
        amountEl = document.createElement('div');
        amountEl.className = 'amount';
        const rupee = document.createElement('span');
        rupee.className = 'rupee';
        rupee.textContent = '₹';
        amountEl.appendChild(rupee);
        amountEl.appendChild(document.createTextNode(
          Number(data.amount).toLocaleString('en-IN')
        ));
      } else {
        amountEl = document.createElement('div');
        amountEl.className = 'no-amount';
        amountEl.textContent = 'Payment Received';
      }

      const rawMsg = document.createElement('div');
      rawMsg.className = 'raw-message';
      rawMsg.textContent = data.raw_message || '';

      const track = document.createElement('div');
      track.className = 'progress-bar-track';
      const bar = document.createElement('div');
      bar.className = 'progress-bar';
      track.appendChild(bar);

      card.appendChild(label);
      card.appendChild(amountEl);
      card.appendChild(rawMsg);
      card.appendChild(track);

      container.appendChild(card);
      cards.unshift(card);

      // Trigger slide-in on the next two frames to ensure initial state is painted
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.classList.add('show');
        });
      });

      // Start progress bar: paint at 100% first, then animate to 0% in the next frame
      requestAnimationFrame(() => {
        bar.style.width = '100%';
        requestAnimationFrame(() => {
          bar.style.transition = `width ${DURATION}ms linear`;
          bar.style.width = '0%';
        });
      });

      // Auto dismiss
      const timer = setTimeout(() => dismissCard(card), DURATION);
      card._timer = timer;
    }

    function dismissCard(card) {
      if (card._dismissed) return;
      card._dismissed = true;

      clearTimeout(card._timer);

      const idx = cards.indexOf(card);
      if (idx !== -1) cards.splice(idx, 1);

      card.classList.remove('show');
      card.classList.add('dismiss');

      setTimeout(() => {
        if (card.parentNode) card.parentNode.removeChild(card);
      }, 250);
    }

    // Socket events are bridged from the preload via contextBridge
    window.socketAPI.onConnect(() => {
      console.log('Socket connected');
    });

    window.socketAPI.onDisconnect(() => {
      console.log('Socket disconnected');
    });

    window.socketAPI.onPayment((data) => {
      showNotification(data);
    });
  </script>
</body>
</html>
